<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173a59"><title>My Weight Workouts</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f3f6fa;color:#162b3b;margin:0;padding:18px;font-size:18px}main{max-width:620px;margin:auto}h1{font-size:28px}h2{font-size:23px}.card{background:white;border-radius:15px;padding:16px;margin:12px 0;box-shadow:0 1px 5px #0001}button,input{font:inherit;border-radius:10px;padding:12px;box-sizing:border-box}button{border:0;background:#1767a2;color:white;cursor:pointer;min-height:48px;margin:4px 3px 4px 0}button.secondary{background:#e5edf4;color:#183b56}button.danger{background:#a83434}input{border:1px solid #aab7c4;width:100%;margin:5px 0 10px}label{font-weight:600;display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.muted{color:#506374;font-size:15px}.exercise{border-top:1px solid #ddd;padding:12px 0}.hidden{display:none}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.small{font-size:15px}#message{color:#225c37}</style></head><body><main><h1>🏋️ My Weight Workouts</h1><p class="muted">Manage routines and track your weightlifting sets. Data stays on this device.</p><div class="row"><h2>My Routines</h2><button onclick="addRoutine()">+ New Routine</button></div><div id="routines"></div><div id="editor" class="card hidden"></div><p id="message" role="status"></p><div class="card"><h2>Backup your routines</h2><p class="muted">Browser storage can be cleared. Export a backup occasionally, especially before changing phones.</p><button class="secondary" onclick="exportData()">Export Backup</button><label for="importFile">Import backup</label><input type="file" id="importFile" accept="application/json,.json" onchange="importData(event)"></div></main><script>
const KEY='my-weight-workouts-v2';const starter=[{id:1,name:'Chest & Triceps',exercises:[{id:11,name:'Chest Press',sets:3,reps:10,weight:0},{id:12,name:'Triceps Pushdown',sets:3,reps:10,weight:0}]},{id:2,name:'Back & Biceps',exercises:[{id:21,name:'Lat Pulldown',sets:3,reps:10,weight:0},{id:22,name:'Biceps Curl',sets:3,reps:10,weight:0}]},{id:3,name:'Legs',exercises:[{id:31,name:'Leg Press',sets:3,reps:10,weight:0}]}];let data;try{data=JSON.parse(localStorage.getItem(KEY))||starter}catch{data=starter}let active=null;function save(){localStorage.setItem(KEY,JSON.stringify(data));render();document.getElementById('message').textContent='Saved on this device.'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){document.getElementById('routines').innerHTML=data.map(r=>`<div class="card row"><div><strong>${esc(r.name)}</strong><div class="muted">${r.exercises.length} exercises</div></div><button onclick="edit(${r.id})">Manage</button></div>`).join('')||'<p>No routines yet. Add one above.</p>';const box=document.getElementById('editor');const r=data.find(x=>x.id===active);if(!r){box.classList.add('hidden');return}box.classList.remove('hidden');box.innerHTML=`<div class="row"><h2>Edit Routine</h2><button class="secondary" onclick="active=null;render()">Close</button></div><label>Routine name</label><input id="routineName" value="${esc(r.name)}"><button onclick="renameRoutine()">Save Name</button><h2>Exercises</h2>${r.exercises.map(e=>`<div class="exercise"><label>Exercise</label><input aria-label="Exercise name" id="n${e.id}" value="${esc(e.name)}"><div class="grid"><div><label class="small">Sets</label><input aria-label="Sets" id="s${e.id}" type="number" min="1" max="20" value="${e.sets}"></div><div><label class="small">Reps</label><input aria-label="Repetitions" id="p${e.id}" type="number" min="1" max="100" value="${e.reps}"></div><div><label class="small">Weight (lb)</label><input aria-label="Weight in pounds" id="w${e.id}" type="number" min="0" step="0.5" value="${e.weight}"></div></div><button onclick="updateExercise(${e.id})">Save Exercise</button><button class="danger" onclick="removeExercise(${e.id})">Remove</button></div>`).join('')}<button onclick="addExercise()">+ Add Exercise</button><hr><button class="danger" onclick="deleteRoutine()">Delete Routine</button>`}function edit(id){active=id;render();document.getElementById('editor').scrollIntoView({behavior:'smooth'})}function addRoutine(){const name=prompt('Name your new routine:');if(!name||!name.trim())return;const id=Date.now();data.push({id,name:name.trim(),exercises:[]});active=id;save()}function renameRoutine(){const name=document.getElementById('routineName').value.trim();if(!name)return alert('Enter a routine name.');data.find(r=>r.id===active).name=name;save()}function addExercise(){const name=prompt('Exercise name:');if(!name||!name.trim())return;data.find(r=>r.id===active).exercises.push({id:Date.now(),name:name.trim(),sets:3,reps:10,weight:0});save()}function updateExercise(id){const e=data.find(r=>r.id===active).exercises.find(x=>x.id===id);const name=document.getElementById('n'+id).value.trim(),sets=Number(document.getElementById('s'+id).value),reps=Number(document.getElementById('p'+id).value),weight=Number(document.getElementById('w'+id).value);if(!name||!Number.isInteger(sets)||sets<1||!Number.isInteger(reps)||reps<1||!Number.isFinite(weight)||weight<0)return alert('Please enter a name and valid sets, reps, and weight.');Object.assign(e,{name,sets,reps,weight});save()}function removeExercise(id){if(!confirm('Remove this exercise?'))return;const r=data.find(r=>r.id===active);r.exercises=r.exercises.filter(e=>e.id!==id);save()}function deleteRoutine(){if(!confirm('Delete this entire routine?'))return;data=data.filter(r=>r.id!==active);active=null;save()}function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-weight-workouts-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importData(ev){const file=ev.target.files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(!Array.isArray(d)||!d.every(r=>typeof r.name==='string'&&Array.isArray(r.exercises)))throw Error('Invalid backup');if(!confirm('Replace current routines with this backup?'))return;data=d;active=null;save()}catch(e){alert('Could not import backup: '+e.message)}ev.target.value=''}render();
</script></body></html>
